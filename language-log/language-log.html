<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Log</title>

  <!-- Swiper CSS (있어도 에러 없음; Hero/Swiper 미사용 시 무시됨) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="eng.css" />
</head>
<body>
  <div id="particle-background"></div>

  <!-- Header (동적 로드) -->
  <div id="header-placeholder"></div>
  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header-placeholder").innerHTML = html;

        const style = document.createElement("link");
        style.rel = "stylesheet";
        style.href = "header.css";
        document.head.appendChild(style);

        const script = document.createElement("script");
        script.src = "header.js";
        script.onload = () => { if (typeof initHeader === "function") initHeader(); };
        document.body.appendChild(script);
      })
      .catch(err => console.error("헤더 로딩 실패:", err));
  </script>

  <!-- 리스트 섹션 -->
  <section class="post-grid-wrapper">
    <div class="toolbar">
      <div class="left">
        <span class="count"><strong id="totalCount">0</strong> posts</span>
      </div>

      <div class="grid-title-bar">
        <h2 class="grid-title">
          all Engineering Note
          <!-- ⚠️ 중복 ID 제거: data-total-count 로 변경 -->
          <span data-total-count style="font-size:.9rem; color:#555; margin-left:8px;">0 posts</span>
        </h2>

        <select id="sortSelect">
          <option value="latest">Latest</option>
          <option value="oldest">Oldest</option>
          <option value="title">Title</option>
        </select>
      </div>
    </div>

    <div id="postGridContainer" class="post-grid-container" aria-live="polite"></div>

    <div class="load-more-wrap">
      <button id="loadMoreBtn" type="button">More notes</button>
    </div>
  </section>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="back.js"></script>
  <script src="eng.js"></script>
</body>
</html>
